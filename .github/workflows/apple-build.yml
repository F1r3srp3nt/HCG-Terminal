# Compile-only checks on GitHub-hosted macOS runners.
#
# - iOS: Debug and Release builds and UNSIGNED archives of both schemes, the way HCG Executable
#   Maker invokes xcodebuild, plus which target and bundle identifier each scheme really produces
#   and the app icon metadata of every built app (Scripts/verify_app_icons.py).
# - Simulator: both apps built for the iOS Simulator and launched into several states (crash check
#   and screenshots), and the package tests run on the iOS Simulator runtime.
# - macOS: the HCGTerminalKit package (Darwin code paths) builds and its tests run.
# - Linux: SSH, SFTP, private-key import and Remote Files tests against a real OpenSSH server
#   in a disposable container (Scripts/start-test-sshd.sh).
#
# No signing identities, profiles or secrets are used, nothing is exported to an IPA, and
# nothing is uploaded anywhere except these logs as workflow artifacts.
name: Apple builds (compile only)

on:
  workflow_dispatch:
  push:
    branches: [main, "claude/**"]

permissions:
  contents: read

jobs:
  ios:
    name: iOS · ${{ matrix.scheme }}
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        scheme: [HCGTerminal, HCGTerminalUnleashed]
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          swift --version
          xcodebuild -showsdks | grep -i -E "ios|iphone" || true

      - name: Schemes and targets
        run: |
          xcodebuild -list -project HCGTerminal.xcodeproj
          for configuration in Debug Release; do
            echo "-- $configuration"
            xcodebuild -project HCGTerminal.xcodeproj -scheme "${{ matrix.scheme }}" -configuration $configuration \
              -destination generic/platform=iOS -showBuildSettings 2>/dev/null \
              | grep -E "^ *(TARGET_NAME|PRODUCT_BUNDLE_IDENTIFIER|ASSETCATALOG_COMPILER_APPICON_NAME|CODE_SIGN_STYLE|CODE_SIGN_ENTITLEMENTS|DEVELOPMENT_TEAM|SWIFT_ACTIVE_COMPILATION_CONDITIONS|SWIFT_VERSION|IPHONEOS_DEPLOYMENT_TARGET|TARGETED_DEVICE_FAMILY) =" | sort -u
          done

      - name: Release build (iphoneos, signing disabled)
        run: |
          set -o pipefail
          mkdir -p logs
          xcodebuild -project HCGTerminal.xcodeproj -scheme "${{ matrix.scheme }}" -configuration Release \
            -destination generic/platform=iOS -derivedDataPath "$RUNNER_TEMP/DD-build" \
            COMPILER_INDEX_STORE_ENABLE=NO CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "logs/${{ matrix.scheme }}-release-build.log"

      - name: Build identity (variant, revision, linked backend)
        if: always()
        run: |
          app="$RUNNER_TEMP/DD-build/Build/Products/Release-iphoneos/${{ matrix.scheme }}.app"
          [ -d "$app" ] || { echo "No Release app"; exit 1; }
          plist="$app/Info.plist"; bin="$app/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$plist")"
          variant=$(/usr/libexec/PlistBuddy -c 'Print :HCGBuildVariant' "$plist")
          echo "CFBundleIdentifier:  $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")"
          echo "CFBundleDisplayName: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$plist")"
          echo "Version (build):     $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist") ($(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist"))"
          echo "HCGBuildVariant:     $variant"
          echo "HCGSourceRevision:   $(/usr/libexec/PlistBuddy -c 'Print :HCGSourceRevision' "$plist")"
          backend=$(nm "$bin" | grep -c '26UnleashedExecutionProvider' || true)
          echo "UnleashedExecutionProvider symbols in binary: $backend"
          case "${{ matrix.scheme }}" in
            HCGTerminal) expected=standard; [ "$backend" -eq 0 ] || { echo "FAIL: standard build contains the Unleashed backend"; exit 1; } ;;
            HCGTerminalUnleashed) expected=unleashed; [ "$backend" -gt 0 ] || { echo "FAIL: Unleashed build lacks the Unleashed backend"; exit 1; } ;;
          esac
          [ "$variant" = "$expected" ] || { echo "FAIL: HCGBuildVariant is $variant, expected $expected"; exit 1; }
          # The same check the "Verify build variant" build phase runs: backend marker in the code.
          Scripts/verify-build-variant.sh "$app" "$expected"
          echo "PASS: ${{ matrix.scheme }} is the $expected variant"

      - name: Variant check self-test (fake bundles)
        run: Scripts/tests/verify-build-variant-test.sh

      - name: Debug build (iphoneos, signing disabled)
        if: always()
        run: |
          set -o pipefail
          mkdir -p logs
          xcodebuild -project HCGTerminal.xcodeproj -scheme "${{ matrix.scheme }}" -configuration Debug \
            -destination generic/platform=iOS -derivedDataPath "$RUNNER_TEMP/DD-debug" \
            COMPILER_INDEX_STORE_ENABLE=NO CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "logs/${{ matrix.scheme }}-debug-build.log"

      - name: App icon metadata (Debug and Release builds)
        if: always()
        run: |
          status=0
          for config in debug:Debug build:Release; do
            dd=${config%%:*}; name=${config##*:}
            app="$RUNNER_TEMP/DD-$dd/Build/Products/$name-iphoneos/${{ matrix.scheme }}.app"
            if [ -d "$app" ]; then python3 Scripts/verify_app_icons.py "$app" || status=1; else echo "No $name app at $app"; status=1; fi
          done
          exit $status

      - name: Header artwork in the compiled asset catalog (Release)
        run: |
          app="$RUNNER_TEMP/DD-build/Build/Products/Release-iphoneos/${{ matrix.scheme }}.app"
          xcrun --sdk iphoneos assetutil --info "$app/Assets.car" > assets.json
          python3 - "$app" <<'PY'
          import json, sys
          entries = json.load(open("assets.json"))
          hero = [e for e in entries if e.get("Name") == "TerminalHero"]
          assert hero, "TerminalHero is missing from Assets.car"
          for e in hero:
              print("TerminalHero:", e.get("PixelWidth"), "x", e.get("PixelHeight"), e.get("Encoding"), "scale", e.get("Scale"))
          assert any(e.get("PixelWidth") == 2000 and e.get("PixelHeight") == 667 for e in hero), "unexpected size"
          print("PASS: TerminalHero (2000x667) in", sys.argv[1].split("/")[-1])
          PY
          if ls "$app"/TerminalHero.mp4 "$app"/TerminalHero.mov >/dev/null 2>&1; then echo "Header animation bundled"; else echo "No header animation bundled (static header; the Animated header setting is hidden)"; fi

      - name: Encryption inventory (read-only)
        if: always()
        # Evidence for export compliance: which crypto the shipped binary links or contains.
        # Symbols are read from the unstripped Release build product; the archive is stripped.
        run: |
          app="$RUNNER_TEMP/DD-build/Build/Products/Release-iphoneos/${{ matrix.scheme }}.app"
          [ -d "$app" ] || { echo "No Release app"; exit 1; }
          bin="$app/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")"
          echo "== $bin"
          echo "-- linked dynamic libraries and frameworks (otool -L):"
          otool -L "$bin" | tail -n +2
          echo "-- embedded frameworks / dylibs in the bundle:"
          ls "$app/Frameworks" 2>/dev/null || echo "none"
          find "$app" -name "*.dylib" -o -name "*.framework" | sed "s#$app/##" || true
          printf -- "-- Swift symbols imported from Apple CryptoKit (undefined \$s9CryptoKit...): "
          nm -u "$bin" | grep -c 's9CryptoKit' || true
          echo "-- distinct CryptoKit types referenced:"
          nm -u "$bin" | grep -oE '9CryptoKit[0-9]+[A-Za-z0-9]+' | sort -u | head -40 || true
          printf -- "-- BoringSSL symbols defined in the binary (CCryptoBoringSSL_*): "
          nm "$bin" | grep -c 'CCryptoBoringSSL' || true
          printf -- "-- OpenSSL/BoringSSL-style C symbols defined (EVP_, AES_encrypt, SSL_CTX, CRYPTO_): "
          nm "$bin" | grep -cE ' [TtDdSs] _(EVP_|AES_encrypt|SSL_CTX|CRYPTO_)' || true
          printf -- "-- 'BoringSSL'/'OpenSSL' strings in the binary: "
          strings -a "$bin" | grep -ciE 'boringssl|openssl' || true
          echo "-- SSH algorithm names compiled in:"
          strings -a "$bin" | grep -oE '^(aes(128|256)-gcm@openssh\.com|curve25519-sha256(@libssh\.org)?|ecdh-sha2-nistp(256|384|521)|ssh-ed25519|ecdsa-sha2-nistp(256|384|521))$' | sort -u || true

      - name: Unsigned archive (as HCG Executable Maker's Unsigned mode)
        if: always()
        run: |
          set -o pipefail
          mkdir -p logs
          xcodebuild -project HCGTerminal.xcodeproj -scheme "${{ matrix.scheme }}" -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DD-archive" -destination generic/platform=iOS \
            -archivePath "$RUNNER_TEMP/${{ matrix.scheme }}.xcarchive" COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= archive 2>&1 | tee "logs/${{ matrix.scheme }}-unsigned-archive.log"

      - name: Inspect archive
        if: always()
        run: |
          ARCHIVE="$RUNNER_TEMP/${{ matrix.scheme }}.xcarchive"
          [ -d "$ARCHIVE" ] || { echo "No archive was produced."; exit 0; }
          ls "$ARCHIVE/Products/Applications"
          for app in "$ARCHIVE"/Products/Applications/*.app; do
            echo "$app"
            /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$app/Info.plist"
            /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$app/Info.plist" || true
            /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$app/Info.plist" || true
            lipo -info "$app/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")"
            codesign -dv "$app" 2>&1 || echo "(not signed, as expected)"
            python3 Scripts/verify_app_icons.py "$app"
            echo "HCGBuildVariant=$(/usr/libexec/PlistBuddy -c 'Print :HCGBuildVariant' "$app/Info.plist") HCGSourceRevision=$(/usr/libexec/PlistBuddy -c 'Print :HCGSourceRevision' "$app/Info.plist")"
          done

      - name: Package variant (unsigned, separate folders)
        if: always()
        run: |
          variant=$([ "${{ matrix.scheme }}" = HCGTerminalUnleashed ] && echo unleashed || echo standard)
          Scripts/package-ios.sh "$variant" "$RUNNER_TEMP/dist" --archive "$RUNNER_TEMP/${{ matrix.scheme }}.xcarchive"
          find "$RUNNER_TEMP/dist" -maxdepth 2 | sed "s#$RUNNER_TEMP/##"
          if [ "$variant" = unleashed ]; then
            ipa=$(ls "$RUNNER_TEMP"/dist/unleashed/*.ipa)
            unzip -l "$ipa" | grep -E "Payload/HCGTerminalUnleashed.app/(Info.plist|HCGTerminalUnleashed)$"
          fi
          [ ! -d "$RUNNER_TEMP/dist/$([ "$variant" = standard ] && echo unleashed || echo standard)" ] || { echo "FAIL: artifacts mixed"; exit 1; }

      - name: Jailbreak package (.deb, Unleashed only; written to disk, never installed)
        if: matrix.scheme == 'HCGTerminalUnleashed'
        run: |
          brew install ldid dpkg >/dev/null
          for layout in rootless rootful; do
            Scripts/package-ios.sh unleashed "$RUNNER_TEMP/dist-$layout" --archive "$RUNNER_TEMP/${{ matrix.scheme }}.xcarchive" \
              --deb "$layout" --ldid-entitlements HCGTerminal-Support/Unleashed-optional-entitlements.example.plist
            deb=$(ls "$RUNNER_TEMP"/dist-$layout/unleashed/*.deb)
            echo "== $deb"
            dpkg-deb -I "$deb"
            dpkg-deb -c "$deb" | grep -E "Applications/HCGTerminalUnleashed.app/(HCGTerminalUnleashed|Info.plist)$"
            mkdir -p "$RUNNER_TEMP/x-$layout" && dpkg-deb -x "$deb" "$RUNNER_TEMP/x-$layout"
            app=$(find "$RUNNER_TEMP/x-$layout" -name HCGTerminalUnleashed.app -maxdepth 4 -type d)
            Scripts/verify-build-variant.sh "$app" unleashed
            ldid -e "$app/HCGTerminalUnleashed"
          done

      - name: Diagnostics summary
        if: always()
        run: |
          for f in logs/*.log; do
            echo "== $f"
            grep -E "(error|warning): " "$f" | grep -v "/SourcePackages/checkouts/" | sort -u || echo "(no errors or warnings from project sources)"
            tail -3 "$f"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-${{ matrix.scheme }}
          path: logs/

  simulator:
    name: iOS Simulator · launch smoke and package tests
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode and boot an iPhone simulator
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; c=[x for k,v in sorted(d.items()) if 'iOS' in k for x in v if x['name'].startswith('iPhone')]; print(c[-1]['udid'])")
          xcrun simctl list devices available | grep "$UDID"
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          # Keep the one-time "slide to type" keyboard tip out of the terminal screenshots.
          xcrun simctl spawn "$UDID" defaults write com.apple.Preferences DidShowContinuousPathIntroduction -bool true || true

      - name: Build both apps for the simulator (Debug)
        run: |
          set -o pipefail
          for scheme in HCGTerminal HCGTerminalUnleashed; do
            xcodebuild -project HCGTerminal.xcodeproj -scheme "$scheme" -configuration Debug -destination "id=$UDID" \
              -derivedDataPath "$RUNNER_TEMP/DDsim" COMPILER_INDEX_STORE_ENABLE=NO build 2>&1 | tail -3
          done

      - name: Launch smoke (both variants, screenshots)
        timeout-minutes: 15
        run: |
          mkdir -p shots; status=0
          for scheme in HCGTerminal HCGTerminalUnleashed; do
            app="$RUNNER_TEMP/DDsim/Build/Products/Debug-iphonesimulator/$scheme.app"
            bundle=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")
            echo "== $scheme ($bundle, variant $(/usr/libexec/PlistBuddy -c 'Print :HCGBuildVariant' "$app/Info.plist"))"
            Scripts/verify-build-variant.sh "$app"
            xcrun simctl install "$UDID" "$app"
            for scenario in launch dashboard unleashed-tap unleashed-checks session capabilities settings files diagnostics; do
              xcrun simctl terminate "$UDID" "$bundle" 2>/dev/null || true
              xcrun simctl launch "$UDID" "$bundle" -HCGSmokeScenario "$scenario" >/dev/null
              sleep 7
              xcrun simctl io "$UDID" screenshot "shots/$scheme-$scenario.png" >/dev/null
              if xcrun simctl spawn "$UDID" launchctl list | grep -q "UIKitApplication:$bundle"; then
                echo "PASS: $scheme running after '$scenario'"
              else
                echo "FAIL: $scheme is not running after '$scenario'"; status=1
              fi
            done
          done
          exit $status

      - name: Event Horizon states (terminal, sheets, appearance, accessibility, landscape)
        timeout-minutes: 20
        run: |
          mkdir -p shots/eh; status=0
          # Every simulator command gets a time limit, so one stuck call fails one shot only.
          t() { local limit=$1; shift; perl -e 'alarm shift; exec @ARGV' "$limit" "$@"; }
          shot() { # shot <scheme> <name> <args...>
            local scheme=$1 name=$2; shift 2
            local app="$RUNNER_TEMP/DDsim/Build/Products/Debug-iphonesimulator/$scheme.app"
            local bundle; bundle=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")
            echo "$(date +%T) $scheme $name"
            t 30 xcrun simctl terminate "$UDID" "$bundle" 2>/dev/null || true
            if ! t 60 xcrun simctl launch "$UDID" "$bundle" "$@" >/dev/null; then echo "FAIL: $scheme $name (launch did not return)"; status=1; return; fi
            sleep 7
            t 30 xcrun simctl io "$UDID" screenshot "shots/eh/$scheme-$name.png" >/dev/null || echo "NOTE: screenshot timed out for $name"
            if t 30 xcrun simctl spawn "$UDID" launchctl list | grep -q "UIKitApplication:$bundle"; then
              echo "PASS: $scheme $name"
            else
              echo "FAIL: $scheme $name (not running)"; status=1
            fi
          }
          for scenario in long-name ansi fullscreen editor new-remote key-import no-session hosts builds artifacts tools \
                          classic-launch classic-session enhanced-launch enhanced-dashboard reduced-launch reduced-session detailoff-session; do
            shot HCGTerminal "$scenario" -HCGSmokeScenario "$scenario"
          done
          for scenario in tools long-name ansi classic-launch enhanced-dashboard; do
            shot HCGTerminalUnleashed "$scenario" -HCGSmokeScenario "$scenario"
          done
          shot HCGTerminal session-keyboard-hidden -HCGSmokeScenario session -HCGSmokeKeyboardHidden

          # System accessibility settings in the simulator (real system values, not app flags).
          if t 30 xcrun simctl ui "$UDID" content_size accessibility-extra-extra-extra-large; then
            for scenario in launch session dashboard settings long-name; do
              shot HCGTerminal "ax-text-$scenario" -HCGSmokeScenario "$scenario"
            done
            shot HCGTerminalUnleashed ax-text-unleashed-checks -HCGSmokeScenario unleashed-checks
            t 30 xcrun simctl ui "$UDID" content_size large || true
          else
            echo "NOTE: content_size is not supported by this simctl; large-text screenshots skipped"
          fi
          if t 30 xcrun simctl ui "$UDID" increase_contrast enabled; then
            for scenario in launch session dashboard; do
              shot HCGTerminal "contrast-$scenario" -HCGSmokeScenario "$scenario"
            done
            t 30 xcrun simctl ui "$UDID" increase_contrast disabled || true
          else
            echo "NOTE: increase_contrast is not supported by this simctl; contrast screenshots skipped"
          fi

          # Landscape last: the simulator stays rotated afterwards.
          shot HCGTerminal landscape-launch -HCGSmokeScenario launch -HCGSmokeLandscape
          shot HCGTerminal landscape-session -HCGSmokeScenario ansi -HCGSmokeLandscape
          shot HCGTerminalUnleashed landscape-session -HCGSmokeScenario session -HCGSmokeLandscape
          exit $status

      - name: Small iPhone and iPad (header layout, terminal, editor; both variants)
        timeout-minutes: 45
        run: |
          mkdir -p shots; status=0
          t() { local limit=$1; shift; perl -e 'alarm shift; exec @ARGV' "$limit" "$@"; }
          pick() { xcrun simctl list devices available -j | python3 -c "
          import json,sys,re
          d=json.load(sys.stdin)['devices']
          devs=[x for k,v in sorted(d.items()) if 'iOS' in k for x in v]
          want=sys.argv[1]
          prefs={'small':['iPhone SE','iPhone 13 mini','iPhone 12 mini','iPhone 16e','iPhone 17e'],'ipad':['iPad mini','iPad (','iPad Air','iPad Pro']}[want]
          for p in prefs:
              m=[x for x in devs if x['name'].startswith(p)]
              if m: print(m[-1]['udid'], m[-1]['name'].replace(' ','_')); break
          " "$1"; }
          # Free the runner for the next simulators: the main iPhone simulator is not needed again
          # until the package tests, which boot it themselves.
          t 60 xcrun simctl shutdown "$UDID" >/dev/null 2>&1 || true
          for kind in small ipad; do
            read -r udid name < <(pick $kind) || true
            [ -n "${udid:-}" ] || { echo "No $kind simulator available"; continue; }
            echo "== $kind: $name"
            # The runner sometimes cannot boot a second simulator. Try twice; if it still is not
            # booted, record the device as skipped (a runner problem, not an app result) instead
            # of letting every following command run into its time limit.
            booted() { xcrun simctl list devices | grep "$udid" | grep -q "(Booted)"; }
            for attempt in 1 2; do
              t 120 xcrun simctl boot "$udid" >/dev/null 2>&1 || true
              t 240 xcrun simctl bootstatus "$udid" -b >/dev/null 2>&1 || true
              booted && break
              echo "NOTE: $name did not boot (attempt $attempt)"; t 60 xcrun simctl shutdown "$udid" >/dev/null 2>&1 || true
            done
            if ! booted; then echo "SKIPPED: $name (simulator did not boot on this runner)"; continue; fi
            t 30 xcrun simctl spawn "$udid" defaults write com.apple.Preferences DidShowContinuousPathIntroduction -bool true || true
            for scheme in HCGTerminal HCGTerminalUnleashed; do
              app="$RUNNER_TEMP/DDsim/Build/Products/Debug-iphonesimulator/$scheme.app"
              bundle=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")
              if ! t 180 xcrun simctl install "$udid" "$app"; then echo "FAIL: $scheme could not be installed on $name"; status=1; continue; fi
              # Warm-up launch (not checked): the first launch on a freshly booted simulator can
              # take over a minute on a busy runner. Every screenshot below is still checked.
              t 180 xcrun simctl launch "$udid" "$bundle" >/dev/null || echo "NOTE: warm-up launch did not return on $name"
              sleep 15
              t 30 xcrun simctl terminate "$udid" "$bundle" 2>/dev/null || true
              runs="launch session long-name dashboard editor"
              [ "$scheme" = HCGTerminalUnleashed ] && runs="launch session"
              [ "$kind" = ipad ] && [ "$scheme" = HCGTerminal ] && runs="$runs landscape"
              for run in $runs; do
                echo "$(date +%T) $scheme $run on $name"
                t 30 xcrun simctl terminate "$udid" "$bundle" 2>/dev/null || true
                if [ "$run" = landscape ]; then args="-HCGSmokeScenario ansi -HCGSmokeLandscape"; suffix=landscape-session
                else args="-HCGSmokeScenario $run"; suffix=$([ "$run" = launch ] && echo home || echo "$run"); fi
                if ! t 120 xcrun simctl launch "$udid" "$bundle" $args >/dev/null; then echo "FAIL: $scheme $run on $name (launch did not return)"; status=1; continue; fi
                sleep 9
                t 60 xcrun simctl io "$udid" screenshot "shots/$name-$scheme-$suffix.png" >/dev/null || echo "NOTE: screenshot timed out ($run on $name)"
                if t 30 xcrun simctl spawn "$udid" launchctl list | grep -q "UIKitApplication:$bundle"; then echo "PASS: $scheme $run on $name"; else echo "FAIL: $scheme $run not running on $name"; status=1; fi
              done
              t 30 xcrun simctl terminate "$udid" "$bundle" || true
            done
            t 60 xcrun simctl shutdown "$udid" || true
          done
          exit $status

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-screenshots
          path: shots/

      - name: Package tests on the iOS Simulator runtime
        if: always()
        working-directory: HCGTerminalKit
        run: |
          set -o pipefail
          xcodebuild test -scheme HCGTerminalKit-Package -destination "id=$UDID" 2>&1 | tee ../simulator-tests.log | grep -E "Test Suite '.*' (passed|failed)|error:|Undefined symbols|ld: |referenced from|Executed [0-9]+ tests|[*][*] TEST" | tail -80

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-simulator-tests
          path: simulator-tests.log

  macos-package:
    name: macOS · HCGTerminalKit build and tests
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Build (macOS)
        working-directory: HCGTerminalKit
        run: |
          set -o pipefail
          swift build --build-tests 2>&1 | tee ../macos-package-build.log
      - name: Test (macOS)
        working-directory: HCGTerminalKit
        timeout-minutes: 15
        # `script` gives the test process a terminal, so its output is line-buffered and a
        # stuck test shows up in the log where it stopped. Stream-based tests have their own
        # deadlines (Tests/TerminalTestSupport), so a hang becomes a failure with its output.
        run: script -q ../macos-package-test.log swift test --skip-build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-macos-package
          path: macos-package-*.log

  linux-ssh:
    name: Linux · SSH, SFTP and key import against OpenSSH
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Root inside the container: the script creates the disposable test user and sshd.
    container: swift:6.0.3-jammy
    # Container steps default to sh; the steps use bash features (pipefail).
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: OpenSSH server (127.0.0.1:2222, SFTP on), ssh-keygen and openssl
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq openssh-server openssh-client openssl >/dev/null
          bash Scripts/start-test-sshd.sh
          ssh -V
      - name: Build tests
        working-directory: HCGTerminalKit
        run: |
          if ! swift build --build-tests -Xlinker --allow-shlib-undefined > ../linux-build.log 2>&1; then
            grep -E "error:|undefined reference|ld: " -B3 -A6 ../linux-build.log | head -150
            tail -20 ../linux-build.log
            exit 1
          fi
          tail -2 ../linux-build.log
      - name: SSH, SFTP, key import and Remote Files tests (real OpenSSH)
        working-directory: HCGTerminalKit
        env:
          HCG_SSH_TEST: "1"
        run: |
          set -o pipefail
          swift test --skip-build --filter "RemoteSSHTests|TerminalSecurityTests|RemoteFilesModelTests|BuildAccessTests" 2>&1 \
            | tee ../linux-ssh-tests.log | grep -E "Test Case .*(passed|failed|skipped)|error:|Executed [0-9]+ tests" | tail -80
          if grep -q "skipped" ../linux-ssh-tests.log; then echo "::warning::some SSH tests were skipped"; grep "skipped" ../linux-ssh-tests.log | head; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-linux-ssh
          path: linux-*.log
